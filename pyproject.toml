[project]
name = "stella-montis"
version = "1.0.1-dev"
description = "Display gamma that follows on-screen brightness while Arc Raiders is in front."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "comtypes>=1.4", "dxcam==0.3.0"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["core", "kernel", "modules", "daemon", "ui"]
